<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Gym · 房间工作台</title>
<style>
:root {
  color-scheme: dark;
  --paper: #05080f;
  --surface: #0b1222;
  --ink: #e6edf7;
  --muted: #7f8ca6;
  --line: rgba(103, 232, 249, .14);
  --accent: #22d3ee;
  --accent-2: #a78bfa;
  --accent-hover: #67e8f9;
  --lime: #a3e635;
  --warn: #fbbf24;
  --danger: #fb7185;
  --focus: #22d3ee;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --display: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100dvh; color: var(--ink); font: 14px/1.5 var(--sans);
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(34, 211, 238, .14), transparent 62%),
    radial-gradient(760px 480px at -6% 108%, rgba(167, 139, 250, .12), transparent 60%),
    var(--paper);
}
body::before {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; content: "";
  background-image:
    linear-gradient(rgba(103, 232, 249, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(103, 232, 249, .05) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 75%);
}
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .55; }
button:focus-visible, input:focus-visible, select:focus-visible, .drop:focus-within {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
#topbar {
  height: 68px;
  padding: 0 36px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: rgba(7, 12, 24, .72);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  position: sticky; top: 0; z-index: 5;
}
.logo {
  display: inline-flex; width: fit-content; align-items: center; gap: 12px;
  font-family: var(--display); font-size: 19px; font-weight: 800; letter-spacing: -.02em;
}
.logo-mark {
  width: 30px; height: 30px; display: grid; place-items: center; color: #04121a;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  font: 800 10px/1 var(--mono); letter-spacing: .04em; border-radius: 7px;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 0 22px rgba(34, 211, 238, .45);
}
.mode-switch {
  display: flex; height: 100%; align-items: center; gap: 4px; padding: 0;
}
.mode-switch button {
  position: relative; height: 34px; padding: 0 16px; color: var(--muted); border: 1px solid transparent;
  border-radius: 999px; background: transparent; font-weight: 600; transition: color .2s, background .2s, border-color .2s;
}
.mode-switch button[aria-pressed="true"] {
  color: #04121a; font-weight: 800; background: var(--accent); border-color: var(--accent);
  box-shadow: 0 0 22px rgba(34, 211, 238, .35);
}
.mode-switch button:hover:not([aria-pressed="true"]) { color: var(--ink); border-color: var(--line); }
.header-source {
  justify-self: end; display: inline-flex; align-items: center; gap: 8px;
  color: var(--muted); font: 500 11px/1 var(--mono); letter-spacing: .06em;
}
.header-source::before {
  width: 7px; height: 7px; border-radius: 50%; background: var(--lime); content: "";
  box-shadow: 0 0 10px var(--lime); animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .35; } }
.workspace {
  height: calc(100dvh - 68px);
  min-height: 625px;
  display: grid;
  grid-template-columns: minmax(230px, .30fr) minmax(0, 1fr);
  gap: clamp(24px, 3.5vw, 60px);
  padding: 28px 36px 30px;
}
.workspace.editing { grid-template-columns: minmax(0, 1fr) 338px; gap: 20px; }
.brief {
  min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
  padding: clamp(30px, 6.6vh, 86px) 0 2px;
}
.scene-kicker {
  display: flex; align-items: center; gap: 9px; margin: 0 0 20px; color: var(--accent);
  font: 700 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
}
.scene-kicker::before { width: 18px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); content: ""; }
.brief h1 {
  margin: 0; font: 800 clamp(38px, 4.03vw, 66px)/1.12 var(--display);
  color: var(--ink); letter-spacing: -.03em;
  background: linear-gradient(120deg, #ffffff 15%, var(--accent) 60%, var(--accent-2) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 28px rgba(34, 211, 238, .18));
}
.brief p { margin: 18px 0 0; color: var(--muted); line-height: 1.8; max-width: 17em; }
.playback { max-width: 276px; margin-top: 32px; }
.demo-start {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 16px; border: 1px solid rgba(34, 211, 238, .5);
  padding: 13px 15px; border-radius: 8px; color: #04121a; font-weight: 800; text-align: left;
  background: linear-gradient(120deg, var(--accent), var(--accent-2));
  box-shadow: 0 10px 30px -10px rgba(34, 211, 238, .55), 0 0 0 1px rgba(255,255,255,.08) inset;
  transition: transform .15s, box-shadow .15s, filter .15s;
}
.demo-start:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 14px 36px -10px rgba(34, 211, 238, .65), 0 0 0 1px rgba(255,255,255,.08) inset; }
.demo-start:active:not(:disabled) { transform: translateY(0); }
.play-mark { width: 0; height: 0; border-block: 5px solid transparent; border-left: 7px solid currentColor; }
#demoStatus { min-height: 21px; margin-top: 12px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#demoProgress { appearance: none; display: block; width: 100%; height: 3px; margin: 11px 0 0; border: 0; border-radius: 2px; background: var(--line); accent-color: var(--accent); overflow: hidden; }
#demoProgress::-webkit-progress-bar { background-color: var(--line); border-radius: 2px; }
#demoProgress::-webkit-progress-value { background-color: var(--accent); border-radius: 2px; box-shadow: 0 0 10px var(--accent); }
#demoProgress::-moz-progress-bar { background-color: var(--accent); border-radius: 2px; }
.specs { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; row-gap: 7px; margin: 30px 0 0; padding: 15px 0 12px; border-top: 1px solid var(--line); }
.specs dt { color: var(--muted); font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.specs dd { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink); }
.scene-view {
  min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; margin: 0;
  border: 1px solid rgba(103, 232, 249, .22); border-radius: 14px; overflow: hidden; background: var(--surface);
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 80px -30px rgba(34, 211, 238, .28), 0 0 60px -20px rgba(167, 139, 250, .25);
}
.viewport {
  min-height: 0; background: #060b16; position: relative; isolation: isolate;
  background-image: radial-gradient(ellipse at 50% 45%, #14263f 0%, #060b16 70%);
}
.viewport::before, .viewport::after {
  position: absolute; z-index: 1; pointer-events: none; content: ""; transition: opacity .3s;
}
/* 四角取景框：HUD 感，不挡鼠标 */
.viewport::before {
  inset: 16px;
  background:
    linear-gradient(var(--accent), var(--accent)) top left / 22px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) top left / 2px 22px no-repeat,
    linear-gradient(var(--accent), var(--accent)) top right / 22px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) top right / 2px 22px no-repeat,
    linear-gradient(var(--accent), var(--accent)) bottom left / 22px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) bottom left / 2px 22px no-repeat,
    linear-gradient(var(--accent), var(--accent)) bottom right / 22px 2px no-repeat,
    linear-gradient(var(--accent), var(--accent)) bottom right / 2px 22px no-repeat;
  opacity: .75;
}
/* 轻扫描线 */
.viewport::after {
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
}
#app { position: absolute; inset: 0; }
#app canvas { display: block; touch-action: none; }
.viewport-tools {
  display: flex; min-height: 52px; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 12px;
  border-top: 1px solid var(--line); background: linear-gradient(180deg, #0d1628, #091022);
}
.cameras, .view-actions { display: flex; align-items: center; gap: 4px; }
.view-button {
  min-height: 32px; border: 1px solid transparent; border-radius: 999px;
  padding: 4px 12px; background: transparent; color: var(--muted); font-size: 12px; white-space: nowrap;
  transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
}
.view-button:hover, .view-button[aria-pressed="true"] { background: rgba(34, 211, 238, .1); color: var(--accent-hover); border-color: rgba(34, 211, 238, .35); }
.view-button[aria-pressed="true"] { font-weight: 700; box-shadow: 0 0 16px -4px rgba(34, 211, 238, .6); }
.view-button:disabled { cursor: not-allowed; }
#joyhint { margin-left: 7px; color: var(--muted); font: 500 11px/1 var(--mono); letter-spacing: .02em; white-space: nowrap; }
#sceneView:fullscreen { border: 0; border-radius: 0; width: 100%; height: 100%; }
#sceneView:not(:fullscreen) #fullscreenPlay { display: none; }
#panel {
  min-width: 0; min-height: 0; overflow: auto; border: 1px solid rgba(103, 232, 249, .22); border-radius: 14px;
  background: linear-gradient(180deg, rgba(14, 24, 44, .92), rgba(9, 15, 30, .92)); scrollbar-width: thin; scrollbar-color: #1e3352 transparent;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 24px 60px -28px rgba(167, 139, 250, .3);
}
.inspector-head {
  position: sticky; top: 0; z-index: 1; padding: 16px 16px 0;
  background: linear-gradient(180deg, rgba(14, 24, 44, .98), rgba(14, 24, 44, .92));
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.inspector-head h2 {
  font: 800 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px;
}
.tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: -1px; border: 1px solid var(--line); border-radius: 10px; background: #070d1b; }
.tabs button {
  flex: 1; padding: 7px 3px; border: 0; border-radius: 7px; color: var(--muted); background: transparent;
  font-size: 12px; white-space: nowrap; transition: color .2s, background .2s;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] {
  color: #04121a; font-weight: 800; background: linear-gradient(120deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 18px -4px rgba(34, 211, 238, .6);
}
.tool-pane { padding: 18px 16px 20px; }
.tool-pane h3 {
  margin: 20px 0 10px; font: 700 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.tool-pane h3::after { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); content: ""; }
.tool-pane h3:first-child { margin-top: 0; }
.tool-pane hr { margin: 20px 0; border: 0; border-top: 1px solid var(--line); }
.btn {
  width: 100%; padding: 8px 11px; border: 1px solid rgba(103, 232, 249, .16); background: rgba(15, 26, 48, .8); color: var(--ink);
  border-radius: 8px; font-size: 12px; text-align: left; min-height: 36px; transition: border-color .2s, background .2s, color .2s, box-shadow .2s;
}
.btn:hover:not(:disabled) { border-color: rgba(34, 211, 238, .6); background: rgba(34, 211, 238, .08); color: var(--accent-hover); }
.btn.primary {
  border-color: transparent; background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #04121a; font-weight: 800;
  box-shadow: 0 8px 22px -10px rgba(34, 211, 238, .7);
}
.btn.primary:hover:not(:disabled) { border-color: transparent; background: linear-gradient(120deg, var(--accent-hover), #c4b5fd); color: #04121a; }
.btn.quiet { color: var(--muted); }
.field { display: flex; align-items: center; gap: 8px; margin: 9px 0; color: var(--muted); font-size: 12px; }
.field input, .field select {
  min-width: 0; min-height: 36px; color: var(--ink); background: #070d1b; border: 1px solid rgba(103, 232, 249, .16); border-radius: 8px; padding: 5px 9px;
  transition: border-color .2s, box-shadow .2s;
}
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34, 211, 238, .18); outline: none; }
.field select { flex: 1; }
.field .btn { width: auto; flex: 0 0 auto; }
.meter { width: 75px; font-family: var(--mono); }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.chk { display: flex; min-height: 32px; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; cursor: pointer; transition: color .2s; }
.chk:hover { color: var(--ink); }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.subtext { color: var(--muted); font-size: 12px; margin: 7px 0 12px; }
.drop {
  position: relative; display: block; padding: 16px 12px; overflow: hidden; border: 1px dashed rgba(103, 232, 249, .35);
  border-radius: 10px; background: repeating-linear-gradient(135deg, rgba(34, 211, 238, .04) 0 10px, transparent 10px 20px), #070d1b;
  color: var(--ink); text-align: center; font-weight: 600; font-size: 13px; cursor: pointer; transition: border-color .2s, box-shadow .2s;
}
.drop:hover, .drop.ok { border-color: var(--accent); box-shadow: 0 0 22px -8px rgba(34, 211, 238, .6); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .thumb { display: none; width: 100%; max-height: 110px; object-fit: contain; margin-top: 10px; border-radius: 6px; }
.drop.ok .thumb { display: block; }
.tool-output { margin: 9px 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.tool-output:empty { display: none; }
.inspector-message { margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.status { color: var(--muted); }
.status.err { color: var(--danger); }
.status.ok { color: var(--lime); }
.status.busy { color: var(--warn); }
.diagnostics { margin-top: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #070d1b; font: 500 11px/1.8 var(--mono); overflow-wrap: anywhere; }
#loading {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; z-index: 2;
  background: radial-gradient(ellipse at 50% 45%, #14263f 0%, #060b16 70%); color: var(--ink);
  transition: opacity .28s; text-align: center; padding: 18px;
}
#loading .bar { width: min(260px, 64vw); height: 3px; border-radius: 2px; background: #15233b; overflow: hidden; }
#loading .bar i {
  display: block; height: 100%; width: 0; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px var(--accent); transition: width .2s;
}
#loading .txt { font: 500 12px/1.4 var(--mono); letter-spacing: .04em; color: var(--accent-hover); }
#toast {
  position: fixed; right: 28px; bottom: 28px; padding: 10px 16px; max-width: calc(100vw - 32px); border-radius: 10px;
  border: 1px solid rgba(34, 211, 238, .4); background: rgba(9, 16, 32, .92); color: var(--ink);
  box-shadow: 0 12px 36px -8px rgba(34, 211, 238, .35); backdrop-filter: blur(10px);
  opacity: 0; transform: translateY(6px); pointer-events: none; z-index: 4; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateY(0); }
@media (max-width: 1050px) {
  #topbar { padding-inline: 22px; }
  .workspace { padding: 20px 22px 24px; gap: 22px; }
  .workspace.editing { grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
  #joyhint { display: none; }
}
@media (max-width: 740px) {
  #topbar { height: 55px; padding-inline: 14px; grid-template-columns: 1fr auto; }
  .header-source { display: none; }
  .mode-switch { gap: 15px; }
  .logo { font-size: 17px; gap: 7px; }
  .logo-mark { width: 25px; height: 25px; }
  .workspace, .workspace.editing { height: auto; min-height: calc(100dvh - 55px); padding: 15px 14px 20px; gap: 13px; grid-template-columns: minmax(0, 1fr); }
  .brief { display: block; padding: 3px 0 0; }
  .brief h1 { font-size: 37px; }
  .scene-kicker { margin-bottom: 5px; }
  .brief p { margin-top: 6px; max-width: none; font-size: 13px; }
  .playback { margin-top: 13px; max-width: none; }
  .demo-start { padding: 9px 13px; }
  #demoStatus { margin-top: 6px; min-height: 17px; }
  .specs { display: none; }
  .scene-view { height: max(380px, 59dvh); }
  .workspace.editing .scene-view { height: max(310px, 51dvh); }
  .viewport-tools { min-height: 43px; padding-inline: 6px; gap: 4px; }
  .view-button { padding-inline: 7px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; }
  .header-source::before { animation: none; }
}
</style>
</head>
<body>
<header id="topbar">
  <div class="logo"><span class="logo-mark" aria-hidden="true">RG</span>Robot Gym</div>
  <nav class="mode-switch" aria-label="页面模式">
    <button id="demoMode" type="button" aria-pressed="true">演示</button>
    <button id="editMode" type="button" aria-pressed="false">工作台</button>
  </nav>
  <div class="header-source">照片重建与机器人仿真</div>
</header>

<main class="workspace" id="workspace">
  <section class="brief" id="brief" aria-labelledby="demo-title">
    <div>
      <div class="scene-kicker">S2 客厅</div>
      <h1 id="demo-title">茶几取杯</h1>
      <p>从房间中央出发，在茶几旁夹起杯子，再带杯回到起点。</p>
      <div class="playback">
        <button id="oneClickDemo" class="demo-start" disabled>播放取杯演示 <span class="play-mark" aria-hidden="true"></span></button>
        <progress id="demoProgress" max="1" value="0" aria-label="演示进度" hidden></progress>
        <div id="demoStatus" role="status">MuJoCo 实测回放 · 约 21 秒</div>
      </div>
    </div>
    <dl class="specs">
      <div><dt>房间重建</dt><dd>群核 World</dd></div>
      <div><dt>实测机器人</dt><dd>S10 + Piper</dd></div>
    </dl>
  </section>

  <section class="scene-view" id="sceneView" aria-label="房间三维视图">
    <div class="viewport" id="viewport">
      <div id="app"></div>
      <div id="loading" role="status">
        <div class="txt" id="loadTxt">正在载入 S2 客厅…</div>
        <div class="bar" aria-hidden="true"><i id="loadBar"></i></div>
      </div>
    </div>
    <div class="viewport-tools">
      <div class="cameras" role="group" aria-label="相机机位">
        <button class="view-button" id="cam0" aria-pressed="true">全景</button>
        <button class="view-button" id="cam1" aria-pressed="false">近景</button>
        <button class="view-button" id="cam2" aria-pressed="false">遮挡视角</button>
      </div>
      <div class="view-actions">
        <span id="joyhint">拖动旋转 · 滚轮缩放</span>
        <button class="view-button" id="fullscreenPlay" disabled>播放演示</button>
        <button class="view-button" id="fullscreen" hidden>全屏</button>
      </div>
    </div>
  </section>

  <aside id="panel" aria-labelledby="inspector-title" hidden>
    <div class="inspector-head">
      <h2 id="inspector-title">场景工具</h2>
      <div class="tabs" role="tablist" aria-label="场景工具分类">
        <button id="tab-room" role="tab" aria-selected="true" aria-controls="tools-room">房间</button>
        <button id="tab-collision" role="tab" aria-selected="false" aria-controls="tools-collision" tabindex="-1">标定</button>
        <button id="tab-task" role="tab" aria-selected="false" aria-controls="tools-task" tabindex="-1">物品</button>
        <button id="tab-view" role="tab" aria-selected="false" aria-controls="tools-view" tabindex="-1">显示</button>
      </div>
    </div>

    <section class="tool-pane" id="tools-room" role="tabpanel" aria-labelledby="tab-room">
      <h3>打开房间</h3>
      <div class="field">
        <select id="cachedWorld" aria-label="已生成房间"><option value="">已生成房间</option></select>
        <button class="btn" id="openWorld">打开</button>
      </div>
      <p class="subtext" id="sceneInfo">S2 客厅 · 群核 World</p>
      <hr>
      <h3>从照片生成</h3>
      <label class="drop" id="dropRoom">
        <input type="file" aria-label="选择房间照片" accept="image/jpeg,image/png,image/webp" id="roomFile" multiple>
        选择房间照片<img class="thumb" id="roomThumb" alt="已选照片">
      </label>
      <p class="subtext">选 1 张照片生成，或至少 20 张同一房间的照片进行重建。</p>
      <button class="btn primary" id="btnGenerate">生成房间</button>
      <div class="tool-output" id="prog" role="status"></div>
    </section>

/* 灯光只影响机器人 / 辅助网格（splat 自发光不受光照） */

/* ================================================================
   房间：真实 Gaussian Splat（群核 World 样例 S2）
   SPZ 朝向自检：标定基线给出 PLY 帧「地面 z=0、天花板 ~1.7m」，
   载入后按 bbox 数值判定是否需要 X 轴翻转，不靠肉眼猜。
   ================================================================ */
const splatRoot = new THREE.Group();   // 标定变换（第三步）将作用于该组
scene.add(splatRoot);
let splatMesh = null;

function flattenSampleFloor(mesh) {
  const packed = mesh.packedSplats;
  if (!packed) return;
  const frame = new THREE.Matrix4();
  const zAxis = new THREE.Vector3(0,0,1);
  const floorZ = -1.08;
  packed.forEachSplat((index, center, scales, rotation, opacity, color) => {
    if (Math.abs(center.z-floorZ) > .07) return;
    // Keep the edit local to the open floor along the S2 demo path.
    const edge = Math.min(center.x+1.54, 1.01-center.x, center.y+.64, .48-center.y);
    if (edge <= 0) return;
    const blend = THREE.MathUtils.smoothstep(edge, 0, .16);
    frame.makeRotationFromQuaternion(rotation);
    const m = frame.elements;
    const s0 = scales.x*scales.x, s1 = scales.y*scales.y, s2 = scales.z*scales.z;
    const xx = m[0]*m[0]*s0 + m[4]*m[4]*s1 + m[8]*m[8]*s2;
    const yy = m[1]*m[1]*s0 + m[5]*m[5]*s1 + m[9]*m[9]*s2;
    const xy = m[0]*m[1]*s0 + m[4]*m[5]*s1 + m[8]*m[9]*s2;
    const zz = m[2]*m[2]*s0 + m[6]*m[6]*s1 + m[10]*m[10]*s2;
    // Preserve each splat's horizontal footprint and color. Thin only the vertical layer.
    const spread = Math.hypot(xx-yy, 2*xy);
    center.z = THREE.MathUtils.lerp(center.z, floorZ-.005, blend);
    scales.set(Math.sqrt((xx+yy+spread)/2), Math.sqrt(Math.max(0, (xx+yy-spread)/2)),
      THREE.MathUtils.lerp(Math.sqrt(zz), .0015, blend));
    rotation.setFromAxisAngle(zAxis, .5*Math.atan2(2*xy, xx-yy));
    packed.setSplat(index, center, scales, rotation, opacity, color);
  });
  packed.needsUpdate = true;
  mesh.needsUpdate = true;
}

function splatStats(up) {
  // 遍历高斯中心（本地坐标，未含 mesh 变换）：bbox + 2cm 直方图
  const box = new THREE.Box3();
  const bins = new Map();
  let count = 0;
  splatMesh.forEachSplat((i, center) => {
    box.expandByPoint(center);
    const b = Math.round(center[up] / 0.02);
    bins.set(b, (bins.get(b) || 0) + 1);
    count++;
  });
  return { box, count, bins };
}

function orientSplat() {
  if (activeWorld.sample) {
    flattenSampleFloor(splatMesh);
    splatMesh.quaternion.identity();
    splatMesh.position.set(0, 0, 1.08);
    splatMesh.scale.setScalar(1);
    setStatus('stat-splat', `${splatMesh.numSplats.toLocaleString()} 高斯 · S2 已标定`, 'ok');
    return;
  }
  const up = activeWorld.upAxis === 'Y' ? 'y' : 'z';
  const st = splatStats(up);
  console.log('[splat] bbox', st.box.min.toArray().map(v=>v.toFixed(2)),
              st.box.max.toArray().map(v=>v.toFixed(2)), 'count', st.count);
  // 候选：identity（帧保留）/ 绕 X 轴 π（SPZ 惯例 Y 翻转的还原）
  const cands = up === 'y'
    ? [{name:'Y → Z', sign:1, q:new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), Math.PI/2)}]
    : [{name:'Z-up', sign:1, q:new THREE.Quaternion()},
       {name:'Z-up 翻转', sign:-1, q:new THREE.Quaternion(1,0,0,0)}];
  // 地面判定：直方图最密主峰（地面平面的高斯数远大于天花板/家具），
  // 不能用 bbox min——扫描外壳离群点会让房间悬浮。
  const floorOf = sign => {
    // 下半区（z<0）直方图主峰 = 地面平面；返回 {z, density}
    let bestBin = null;
    for (const [b, n] of st.bins) {
      const z = b * 0.02;
      const zw = z * sign;
      if (zw < 0 && (!bestBin || n > bestBin.n)) bestBin = { z:zw, n };
    }
    return bestBin ?? { z:Math.min(st.box.min[up]*sign, st.box.max[up]*sign), n:0 };
  };
  const ceilOf = sign => {
    let bestBin = null;
    for (const [b, n] of st.bins) {
      const z = b * 0.02;
      const zw = z * sign;
      if (zw > 0 && (!bestBin || n > bestBin.n)) bestBin = { z:zw, n };
    }
    return bestBin ?? { z:Math.max(st.box.min[up]*sign, st.box.max[up]*sign), n:0 };
  };
  let best = null;
  for (const c of cands) {
    const mn = st.box.min.clone().applyQuaternion(c.q);
    const mx = st.box.max.clone().applyQuaternion(c.q);
    const zlo = Math.min(mn.z, mx.z), zhi = Math.max(mn.z, mx.z);
    const floor = floorOf(c.sign);
    const ceil = ceilOf(c.sign);
    const roomH = ceil.z - floor.z;   // 层高（主峰间距，排除离群点）
    // 主判据：地面主峰密度（真地面的密集平面远胜误判的天花板/外壳）；
    // 次判据：层高接近常见 2.6m。分数越低越好。
    const score = -floor.n / st.count + Math.abs(roomH - 2.6) * 0.01;
    console.log(`[splat] ${c.name}: z[${zlo.toFixed(2)}, ${zhi.toFixed(2)}] 地面=${floor.z.toFixed(2)}(n=${floor.n}) 顶=${ceil.z.toFixed(2)} 层高=${roomH.toFixed(2)} score=${score.toFixed(4)}`);
    if (!best || score < best.score) best = { ...c, score, floorZ: floor.z, roomH };
  }
  splatMesh.quaternion.copy(best.q);
  splatMesh.position.z = -best.floorZ;   // 检出的地面平面精确压到 z=0
  setStatus('stat-splat', `splat ${st.count.toLocaleString()} 高斯 · ${best.name} · 地面 z=0（室高 ${best.roomH.toFixed(2)}m）`, 'ok');
}

async function loadSplat() {
  splatMesh = new SplatMesh({ url: SPLAT_URL });
  splatRoot.add(splatMesh);
  await splatMesh.initialized;

}

/* ================================================================
   可行走区参考（evidence/G1/calibration_baseline.json）

const WALK = { x:[-2.5, 3.0], y:[-0.5, 1.0] };
const helpersGroup = new THREE.Group();
const walkGroup = new THREE.Group();   // S2 专属可行走区描边（新房间载入时隐藏）
function addHelpers() {

  walkGroup.add(rect);
  const line = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(WALK.x[0], WALK.y[0], .006), new THREE.Vector3(WALK.x[1], WALK.y[0], .006),
      new THREE.Vector3(WALK.x[1], WALK.y[1], .006), new THREE.Vector3(WALK.x[0], WALK.y[1], .006)]),

/* ================================================================
   机器人 —— S10+Piper 官方 GLB 按 MuJoCo 导出的关节树组装
   ================================================================ */
const LEGS = ['fl','fr','hl','hr'];
const DOG_IDLE = {
  fl:[ .08,-1.2,2.1,0], fr:[-.08,-1.2,2.1,0],
  hl:[ .08,1.2,-2.1,0], hr:[-.08,1.2,-2.1,0],
};
const ARM_STOW = [0,1.2,-1.2,0,-1.2,0];
const robot = new THREE.Group();
const joints = {};
const loader = new GLTFLoader();
const housing = new THREE.MeshStandardMaterial({color:0xd3dfe7, roughness:.54, metalness:.18});
const chassis = new THREE.MeshStandardMaterial({color:0x546476, roughness:.54, metalness:.18});
const tyre = new THREE.MeshStandardMaterial({color:0x25292e, roughness:.83});
const hub = new THREE.MeshStandardMaterial({color:0x5c7183, roughness:.45, metalness:.18});
const hubMarker = new THREE.MeshStandardMaterial({color:0x77ddd1, roughness:.46});
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 64;
const shadowContext = shadowCanvas.getContext('2d');
const shade = shadowContext.createRadialGradient(32,32,0,32,32,32);
shade.addColorStop(0,'rgba(0,0,0,.64)');
shade.addColorStop(.38,'rgba(0,0,0,.40)');
shade.addColorStop(1,'rgba(0,0,0,0)');
shadowContext.fillStyle = shade;
shadowContext.fillRect(0,0,64,64);
const contactTexture = new THREE.CanvasTexture(shadowCanvas);
const contactPlane = new THREE.PlaneGeometry(.23,.16);
const wheelContacts = LEGS.map(() => {
  const mesh = new THREE.Mesh(contactPlane, new THREE.MeshBasicMaterial({
    map:contactTexture, transparent:true, depthWrite:false,
  }));
  mesh.renderOrder = 1;
  mesh.visible = false;
  scene.add(mesh);
  return mesh;
});
const wheelCenter = new THREE.Vector3();

function updateWheelContacts() {
  const show = activeWorld.sample && robot.visible && splatMesh?.visible;
  for (let i=0; i<LEGS.length; i++) {
    const shadow = wheelContacts[i];
    shadow.visible = !!show;
    if (!show) continue;
    joints[LEGS[i]+'_wheel'].group.getWorldPosition(wheelCenter);
    shadow.position.set(wheelCenter.x,wheelCenter.y,.001);
    shadow.rotation.z = robot.rotation.z;
    shadow.material.opacity = .83 * (1-THREE.MathUtils.smoothstep(wheelCenter.z-.081, .004, .035));
  }
}

function addWheelFace(group, name) {
  const sign = name[1] === 'l' ? 1 : -1;
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(.046,.046,.003,28), hub);
  plate.position.y = sign*.020;
  const tick = new THREE.Mesh(new THREE.BoxGeometry(.005,.0015,.020), hubMarker);
  tick.position.set(0,sign*.022,.031);
  group.add(plate,tick);
}

async function buildRobot(onStep) {
  const response = await fetch(MODEL_DIR+'s10-piper-rig.json');
  if (!response.ok) throw new Error('S10 官方关节层级加载失败');
  const rig = await response.json();
  const groups = {base_link:robot};
  const loads = [];
  for (const entry of rig) {
    const group = entry.parent ? new THREE.Group() : robot;
    groups[entry.name] = group;
    if (entry.parent) {
      group.position.fromArray(entry.position);
      const [w,x,y,z] = entry.quaternion_wxyz;
      group.quaternion.set(x,y,z,w);
      groups[entry.parent].add(group);
    }
    if (entry.joint) {
      joints[entry.name] = {group, type:entry.joint.type,
        position:group.position.clone(), quaternion:group.quaternion.clone(),
        axis:new THREE.Vector3(...entry.joint.axis)};
    }
    for (const name of entry.meshes) {
      loads.push(loader.loadAsync(MODEL_DIR+name+'.glb').then(({scene:visual}) => {
        const wheel = name.endsWith('_wheel');
        const shell = name === 'base_link' || name.endsWith('_hipx') || name === 'gripper_base';
        visual.traverse(mesh => {
          if (!mesh.isMesh) return;
          mesh.material = wheel ? tyre : shell ? chassis : housing;
        });
        group.add(visual);
        if (wheel) addWheelFace(group, name);
        onStep?.();
      }));
    }
  }
  await Promise.all(loads);
}

const jointRotation = new THREE.Quaternion();
const jointOffset = new THREE.Vector3();
function setJoint(name, value) {
  const joint = joints[name];
  if (!joint) return;
  if (joint.type === 'slide') {
    // MuJoCo prismatic axes are in the rest body frame, not in the parent's world axes.
    jointOffset.copy(joint.axis).multiplyScalar(value).applyQuaternion(joint.quaternion);
    joint.group.position.copy(joint.position).add(jointOffset);
  } else {
    joint.group.quaternion.copy(joint.quaternion)
      .multiply(jointRotation.setFromAxisAngle(joint.axis, value));
  }
}

function setDogPose(leg, q) {
  ['hipx','hipy','knee','wheel'].forEach((part,i) => setJoint(leg+'_'+part,q[i]));
}

function setArmPose(arm, fingers) {
  arm.forEach((q,i) => setJoint('link'+(i+1),q));
  const [left,right] = Array.isArray(fingers) ? fingers : [.035,-.035];
  setJoint('link7', left);
  setJoint('link8', right);
}

function poseRobot() {
  for (const [leg, q] of Object.entries(DOG_IDLE)) setDogPose(leg, q);
  setArmPose(ARM_STOW, 0);   // 收臂搬运姿态
}

function standOnFloor() {
  poseRobot();
  robot.updateMatrixWorld(true);
  const bounds = new THREE.Box3();
  const bottom = Math.min(...LEGS.map(leg =>
    bounds.setFromObject(joints[leg+'_wheel'].group, true).min.z));
  if (Number.isFinite(bottom)) robot.position.z += .002 - bottom;
}

const ROBOT_HOME = { x: 0.35, y: -0.10, z: 0.27, yaw: Math.PI };

/* ================================================================
   机位（世界 Z-up，均位于室内；机位③ 借沙发/皮椅群验证真实遮挡）
   ================================================================ */
const CAMS = [
  { pos:[ 1.12, 1.42, 1.48], target:[-.57,-.10,.40], name:'全景' },
  { pos:[ 1.9, 0.8, 1.1], target:[ 0.3, 0.1, 0.35], name:'正面' },
  { pos:[-2.5, 0.35, 0.30], target:[ 0.3, 0.1, 0.25], name:'遮挡位（茶几前景深度）' },
];
let newRoomCams = CAMS;
let previewStart = [0, 0];

function resetRoomCameras() {
  if (activeWorld.sample) {
    newRoomCams = CAMS;
    setCam(0);
    return;
  }
  splatMesh.updateWorldMatrix(true, false);
  const xs = [], ys = [];
  const cells = new Map();
  const cellSize = .22;
  splatMesh.forEachSplat((i, center) => {
    if (i % 16 !== 0) return;
    const p = center.clone().applyMatrix4(splatMesh.matrixWorld);
    if (p.z > 0.05 && p.z < 2.5) { xs.push(p.x); ys.push(p.y); }
    if (p.z < -.10 || p.z > .80) return;
    const x = Math.round(p.x/cellSize), y = Math.round(p.y/cellSize);
    const key = x + ',' + y;
    const cell = cells.get(key) || {floor:0, obstacle:0, x, y};
    if (Math.abs(p.z) < .09) cell.floor++;
    if (p.z > .16) cell.obstacle++;
    cells.set(key, cell);
  });
  const centerOf = values => {
    if (!values.length) return 0;
    values.sort((a,b) => a-b);
    return (values[Math.floor(values.length*0.23)] + values[Math.floor(values.length*0.77)])/2;
  };
  const x = centerOf(xs), y = centerOf(ys);
  let best = Infinity;
  previewStart = [x,y];
  for (const cell of cells.values()) {
    if (cell.floor < 4) continue;
    const px = cell.x*cellSize, py = cell.y*cellSize;
    const offset = Math.hypot(px-x, py-y);
    if (offset > 1.7) continue;
    let occupied = 0;
    for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) {
      occupied += cells.get((cell.x+dx) + ',' + (cell.y+dy))?.obstacle ?? 0;
    }
    const score = occupied / (cell.floor + 4) + .45*offset;
    if (score < best) { best = score; previewStart = [px,py]; }
  }
  const [px,py] = previewStart;
  const front = new THREE.Vector2(x-px, y-py);
  if (front.length() < .35) front.set(1,0);
  front.normalize();
  newRoomCams = [
    {pos:[px-1.12*front.x+.15*front.y,py-1.12*front.y-.15*front.x,1.35],target:[px+.30*front.x,py+.30*front.y,0.65]},
    {pos:[px+.65*front.y,py-.65*front.x,1.05],target:[px,py,.45]},
    {pos:[px,py-.25,2.25],target:[px,py+.12,0]},
  ];
  setCam(0);
}
function setCam(i) {
  const c = newRoomCams[i];
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  controls.update();
  [0,1,2].forEach(k => $('cam'+k).setAttribute('aria-pressed', k===i));
}
for (let i=0;i<3;i++) $('cam'+i).onclick = () => {
  controls.dispatchEvent({type:'start'});
  setCam(i);
};

/* 显示开关 */
$('chkSplat').onchange = e => { splatMesh.visible = e.target.checked; };
$('chkRobot').onchange = e => { robot.visible = e.target.checked; };
$('chkGrid').onchange = e => { helpersGroup.visible = e.target.checked; };
$('qualityMode').onchange = e => {
  renderer.setPixelRatio(e.target.checked ? 2 : Math.min(devicePixelRatio, 2));
  resizeViewport();
};

/* ================================================================
   主循环 + FPS
   ================================================================ */
let frames = 0, last = performance.now();
function loop() {
  controls.update();
  updateWheelContacts();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - last > 1000) {
    const rate = frames*1000/(now-last);
    $('fps').textContent = rate < 1 ? '低于 1 FPS' : `${Math.round(rate)} FPS`;
    frames = 0; last = now;
  }
  requestAnimationFrame(loop);
}

/* ================================================================
   启动：splats 与机器人并行装配，全部就绪后进入场景
   ================================================================ */
(async () => {
  addHelpers();
  const glbCount = 27;
  let done = 0;
  const bump = () => { done++;
    $('loadTxt').textContent = `装配 S10+Piper 官方模型 (${done}/${glbCount} 个部件)…`;
    $('loadBar').style.width = `${(done/glbCount)*70}%`; };

  const robotP = buildRobot(bump).then(() => {
    robot.position.set(ROBOT_HOME.x, ROBOT_HOME.y, ROBOT_HOME.z);
    robot.rotation.z = ROBOT_HOME.yaw;
    scene.add(robot);
    standOnFloor();
    setStatus('stat-robot', 'S10+Piper 官方 GLB · 站立', 'ok');
  });

  const splatP = loadSplat().then(() => {
    $('loadBar').style.width = '95%';
  }).catch(err => {
    console.error(err);
    setStatus('stat-splat', 'splat 加载失败: ' + (err?.message||err), 'err');
    throw err;
  });

  try {
    await Promise.all([robotP, splatP]);
  } catch (e) {
    $('loadTxt').textContent = '加载失败：' + (e?.message||e) + '（需从仓库根目录以静态服务打开本页）';
    return;
  }
  $('loadBar').style.width = '100%';
  resetRoomCameras();
  roomTools = createRoomTools({scene, camera, renderer, controls, robot, standOnFloor,
    splat:()=>splatMesh, setDogPose, setArmPose, api:API, robotHome:ROBOT_HOME,
    openSample:()=>swapRoom(SAMPLE_WORLD), resetRoomCameras});
  roomTools.setWorld(activeWorld);
  $('oneClickDemo').disabled = $('fullscreenPlay').disabled = false;
  loop();
  setTimeout(() => { const l=$('loading'); l.style.opacity='0'; setTimeout(()=>l.remove(), 450); }, 250);
  await refreshCachedWorlds();
  const world = new URLSearchParams(location.search).get('world');
  if (world) await openWorld(world);
})();

/* ================================================================
   第二步：真实单图生成 —— 上传 → 群核 World → splat 就绪换房间
   ================================================================ */
const API = location.port === '8100' ? 'http://127.0.0.1:8000' : '';  // 静态服务直开时跨调后端
const prog = t => { $('prog').textContent = t; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

let roomPhotos = [];
let roomPreviewUrl;
function selectRoomPhotos(files) {
  roomPhotos = Array.from(files);
  if (roomPreviewUrl) URL.revokeObjectURL(roomPreviewUrl);
  if (!roomPhotos.length) return;
  roomPreviewUrl = URL.createObjectURL(roomPhotos[0]);
  const th = $('roomThumb'); th.src = roomPreviewUrl; th.parentElement.classList.add('ok');
  const count = roomPhotos.length;
  prog(count === 1 ? '已选 1 张，单图生成' : count >= 20 ? `已选 ${count} 张，高清重建` : `已选 ${count} 张，多图重建至少需要 20 张`);
}
$('roomFile').onchange = e => selectRoomPhotos(e.target.files);
$('dropRoom').ondragover = e => e.preventDefault();
$('dropRoom').ondrop = e => { e.preventDefault(); selectRoomPhotos(e.dataTransfer.files); };

async function refreshCachedWorlds() {
  try {
    const response = await fetch(API + '/api/worlds');
    if (!response.ok) return;
    const selected = $('cachedWorld').value;
    $('cachedWorld').replaceChildren(new Option('已生成房间',''), new Option('S2 客厅','sample'));
    for (const w of await response.json()) {
      const label = w.result.sourceMode === 'reconstructed' ? '多图重建' : '单图生成';
      $('cachedWorld').append(new Option(`${label} · ${w.result.worldId}`, w.id));
    }
    $('cachedWorld').value = selected;
  } catch {
    // S2 remains usable with the static page.
  }
}

async function openWorld(id) {
  if (!id) return;
  try {
    const data = id === 'sample' ? SAMPLE_WORLD : await fetch(`${API}/api/worlds/${encodeURIComponent(id)}`).then(r => r.json());
    if (id !== 'sample' && data.status !== 'ready') throw new Error(data.error || '三维素材还没就绪');
    await swapRoom(data.result ?? data);
    if (id !== 'sample') await roomTools.restoreLastScene();
  } catch (error) { prog(error.message); }
}
$('openWorld').onclick = () => openWorld($('cachedWorld').value);

$('btnGenerate').onclick = async () => {
  if (!roomPhotos.length) { toast('请先选择房间照片'); return; }
  if (roomPhotos.length > 1 && roomPhotos.length < 20) {
    prog('请选 1 张照片生成，或选择至少 20 张同一房间照片重建。');
    return;
  }
  const btn = $('btnGenerate');
  btn.disabled = true;
  try {
    prog('上传照片 → 提交 World 任务…');
    const fd = new FormData();
    for (const photo of roomPhotos) fd.append('image', photo);
    const r = await fetch(`${API}/api/worlds`, { method:'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || `HTTP ${r.status}`);
    const { id } = await r.json();
    toast(`World 任务 ${id} 已提交`);
    await pollWorld(id);
  } catch (err) {
    prog(`提交失败 · ${err.message}`);
  } finally { btn.disabled = false; }
};

async function pollWorld(id) {
  const until = Date.now() + 3600000;
  while (Date.now() < until) {
    await sleep(3000);
    let j;
    try {
      const r = await fetch(`${API}/api/worlds/${id}`);
      if (!r.ok) { prog(`任务 ${id}：等待后端… (HTTP ${r.status})`); continue; }
      j = await r.json();
    } catch { prog(`任务 ${id}：后端暂不可达，重试中…`); continue; }
    prog(`任务 ${j.worldId || id} · ${j.stage || j.status}`);
    if (j.status === 'ready') {
      try {
        await swapRoom(j.result);
        await refreshCachedWorlds();
        $('cachedWorld').value = id;
      } catch (err) {
        prog(`房间加载失败 · ${err.message}`);
      }
      return;
    }
    if (j.status === 'failed') {
      prog(`任务 ${j.worldId || id} 失败 · ${j.error || '未知原因'}`);
      return;
    }
  }
  prog(`已停止等待任务 ${id}。完成后可从「已生成房间」打开。`);
}

async function swapRoom(result) {
  if (!result || !result.splat) throw new Error('后端未返回 splat 地址');
  if (result.worldId === activeWorld.worldId && splatMesh?.numSplats) return;
  prog('加载新房间三维产物…');
  const url = API + result.splat;
  const mesh = new SplatMesh({ url });
  try {
    await mesh.initialized;
  } catch (err) {
    mesh.dispose();
    throw err;
  }
  if (!mesh.numSplats) { mesh.dispose(); throw new Error('三维文件没有可显示的高斯'); }
  const old = splatMesh;
  activeWorld = result;
  splatRoot.add(mesh);
  splatMesh = mesh;
  splatRoot.remove(old);
  old?.dispose();
  mesh.visible = $('chkSplat').checked;
  orientSplat();
  walkGroup.visible = !!activeWorld.sample;
  resetRoomCameras();
  roomTools.setWorld({...result, previewStart});
  const label = result.sourceMode === 'reconstructed' ? '多图重建' : '单图生成';
  $('sceneInfo').textContent = result.sample ? 'S2 客厅 · 群核 World' : `${label} · ${result.worldId}`;
  await spark.update({scene, camera});
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  setStatus('stat-splat', `3D 已就绪 · ${mesh.numSplats.toLocaleString()} 个高斯`, 'ok');
  prog('');
}

/* 供后续步骤（标定碰撞）复用的句柄 */
window.ROOM = { scene, camera, renderer, controls, splatRoot, splatMeshRef:()=>splatMesh, robot, joints, CAMS, setCam, WALK, ROBOT_HOME, walkGroup, swapRoom, tools:()=>roomTools };
</script>
</body>
